[package]
name = "dongsi-server"
description = "dongsi 서버 코어: 시그널링, SFU(str0m), 로컬 감지 응답. 전용 서버와 앱 내장 서버가 같이 쓴다"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
crossbeam-channel = "0.5.17"
dongsi-core = { path = "../core" }
dongsi-net = { path = "../net" }
futures-util = "0.3.34"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
str0m = { version = "0.25.0", default-features = false, features = ["aws-lc-rs"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "test-util", "process"] }

# 전체 시험 전용(AGENTS.md "빌드·테스트"): 실제 서버를 띄우는 서버 E2E `tests/e2e`. 기본 `cargo test --workspace`는
# 빌드하지 않는다.
# 켜기: `cargo test-full`(= `cargo test --workspace --features full-tests --no-fail-fast`) 또는
# `cargo test -p <이 패키지> --features full-tests --test <이름>`. 시험 밖의 코드는 이 기능을 보지 않는다.
[features]
full-tests = []

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["full-tests"]
