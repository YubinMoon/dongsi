[package]
name = "dongsi-core"
description = "dongsi 공통 타입: 서버 주소, 인증서 지문, 설치 ID, 초대 코드, 서버 목록"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["serde", "v4"] }
