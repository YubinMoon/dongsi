[package]
name = "dongsi-media"
description = "dongsi 미디어: 화면·창 캡처(Windows.Graphics.Capture), 오디오 루프백(WASAPI), WebRTC용 인코딩"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dongsi-core = { path = "../core" }
# ffmpeg 공유 라이브러리(DLL)에 링크한다. 경로는 .cargo/config.toml의 FFMPEG_DIR.
ffmpeg-sys-next = { version = "9.1.1", default-features = false, features = ["avcodec", "swscale"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
wasapi = "0.27.0"

[dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    # Ole·Variant: 썸네일 JPEG 품질(IPropertyBag2::Write, D-076)
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# 전체 시험 전용(AGENTS.md "빌드·테스트"): 이 PC의 실제 화면을 캡처하고 인코더를 돌리는 `tests/`, 주 모니터를 찍는
# 단위 시험 `thumbnail_of_primary_monitor`(기능이 없으면 ignore). 기본 `cargo test --workspace`는 돌리지 않는다.
# 켜기: `cargo test-full`(= `cargo test --workspace --features full-tests --no-fail-fast`) 또는
# `cargo test -p <이 패키지> --features full-tests --test <이름>`. 시험 밖의 코드는 이 기능을 보지 않는다.
[features]
full-tests = []

[[test]]
name = "source_fps"
path = "tests/source_fps.rs"
required-features = ["full-tests"]

[[test]]
name = "switch_source"
path = "tests/switch_source.rs"
required-features = ["full-tests"]

[[test]]
name = "bitrate_cap"
path = "tests/bitrate_cap.rs"
required-features = ["full-tests"]

[[test]]
name = "simulcast"
path = "tests/simulcast.rs"
required-features = ["full-tests"]
