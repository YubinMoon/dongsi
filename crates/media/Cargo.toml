[package]
name = "dongsi-media"
description = "dongsi 미디어: 화면·창 캡처(Windows.Graphics.Capture), 오디오 루프백(WASAPI), WebRTC용 인코딩"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dongsi-core = { path = "../core" }
# ffmpeg 공유 라이브러리(DLL)에 링크한다. 경로는 .cargo/config.toml의 FFMPEG_DIR.
ffmpeg-sys-next = { version = "9.1.1", default-features = false, features = ["avcodec", "swscale"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
wasapi = "0.27.0"

[dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
