# dongsi 전용 서버 — 브리지 네트워크(기본).
#
#   cd deploy
#   DONGSI_ADDRESSES=<호스트 주소> docker compose up -d           # 릴리스 이미지(GHCR)
#   DONGSI_ADDRESSES=<호스트 주소> docker compose up -d --build   # 저장소 소스로 빌드
#   DONGSI_PORT=9000 DONGSI_ADDRESSES=<호스트 주소> docker compose up -d --build   # 다른 포트
#   docker compose logs dongsi-server      # 초대 코드(dongsi1:...)가 나온다
#
# DONGSI_PORT(기본 7884), DONGSI_ADDRESSES, DONGSI_NAME은 이 파일 옆의 .env나 셸 환경 변수로 줄 수 있다.
# 호스트 포트와 컨테이너 포트가 같은 번호가 되도록 DONGSI_PORT 하나로 정한다.
# 설명은 README.md를 본다.
services:
  dongsi-server:
    build:
      context: ..
      dockerfile: Dockerfile
    # 릴리스 이미지(GHCR). --build 없이 up하면 받아 쓰고, --build를 주면 위 소스로 빌드해 이 이름을 붙인다.
    image: ghcr.io/yubinmoon/dongsi-server:${DONGSI_IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      # TCP(시그널링)와 UDP(미디어, 로컬 감지)를 같은 번호로 연다.
      # 호스트와 컨테이너 번호가 같으므로 DONGSI_PUBLIC_PORT는 필요 없다.
      # 번호를 다르게 매핑하려면(예: "9000:7884") 이 두 줄을 고치고 DONGSI_PUBLIC_PORT=9000을 environment에 더한다.
      - "${DONGSI_PORT:-7884}:${DONGSI_PORT:-7884}/tcp"
      - "${DONGSI_PORT:-7884}:${DONGSI_PORT:-7884}/udp"
    environment:
      # 서버가 듣는 TCP·UDP 포트(위 ports와 같은 값)
      DONGSI_PORT: "${DONGSI_PORT:-7884}"
      # 목록과 로컬 감지에 보이는 서버 이름
      DONGSI_NAME: "${DONGSI_NAME:-dongsi 서버}"
      # 초대 코드에 넣을 호스트 주소(도메인, 공인 IP, LAN·Tailscale IP). 쉼표나 공백으로 여러 개.
      # 브리지 네트워크의 컨테이너는 호스트 주소를 알 수 없으므로 꼭 준다.
      DONGSI_ADDRESSES: "${DONGSI_ADDRESSES:-}"
      # 컨테이너 안의 인터페이스 주소(172.17.x.x)는 밖에서 닿지 않으므로 초대 코드에 넣지 않는다.
      DONGSI_AUTO_ADDRESSES: "false"
      # 호스트 포트를 다른 번호로 매핑할 때만(위 ports를 고쳤을 때): DONGSI_PUBLIC_PORT: "9000"
      # DONGSI_MAX_BROADCASTS: "16"
      # DONGSI_MAX_VIEWERS: "16"
      # DONGSI_DISCOVERY: "true"
    volumes:
      # 인증서와 설정(서버 신원). 지우면 지문이 바뀐다.
      - dongsi-data:/data

volumes:
  dongsi-data:
