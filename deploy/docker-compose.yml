services:
  dongsi-server:
    image: ghcr.io/yubinmoon/dongsi-server:latest
    restart: unless-stopped
    ports:
      - "7884:7884/tcp"
      - "7884:7884/udp"
    environment:
      DONGSI_NAME: dongsi 서버
      DONGSI_ADDRESSES: ""
      DONGSI_AUTO_ADDRESSES: "false"
    volumes:
      - dongsi-data:/data

volumes:
  dongsi-data:
