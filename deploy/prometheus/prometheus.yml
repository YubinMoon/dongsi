# dongsi 전용 서버의 지표를 모으는 Prometheus 설정(docker-compose.metrics.yml이 쓴다).
# 다른 곳에서 돌리는 Prometheus라면 targets를 서버의 DONGSI_METRICS_ADDR(예: 127.0.0.1:9884)로 바꾼다.
global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: dongsi
    static_configs:
      - targets: ["dongsi-server:9884"]
