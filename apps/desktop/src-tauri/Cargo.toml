[package]
name = "dongsi-desktop"
description = "dongsi 데스크톱 앱 (서버 목록, 시청, 방송)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `_lib` 접미사는 bin 이름과 겹치지 않게 하기 위해 필요하다(Windows 한정 문제).
# https://github.com/rust-lang/cargo/issues/8519
name = "dongsi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 캡처 대상 미리 보기(JPEG)를 data URL로 보낸다. dongsi-core와 같은 버전.
base64 = "0.23.1"
dongsi-core = { path = "../../../crates/core" }
dongsi-media = { path = "../../../crates/media" }
dongsi-net = { path = "../../../crates/net" }
dongsi-server = { path = "../../../crates/server" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 시작 창(src/splash.rs): Win32 창을 Direct2D·DirectWrite로 그린다. Wi-Fi 감지(src/wifi.rs)는 IpHelper·WiFi를 쓴다. dongsi-media와 같은 버전(Cargo.lock).
[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
# 통합 시험(`tests/`)의 시청 쪽 수신자. 송출·서버와 같은 버전(Cargo.lock)을 쓴다.
str0m = { version = "0.25.0", default-features = false, features = ["aws-lc-rs"] }

# 전체 시험 전용(AGENTS.md "빌드·테스트"): 내장 서버를 LAN 주소에 띄우는 `tests/lan_broadcast.rs`,
# 창을 띄우는 `tests/follow_lol.rs`(시험은 `--ignored`). 기본 `cargo test --workspace`는 빌드하지 않는다.
# 켜기: `cargo test-full`(= `cargo test --workspace --features full-tests --no-fail-fast`) 또는
# `cargo test -p <이 패키지> --features full-tests --test <이름>`. 시험 밖의 코드는 이 기능을 보지 않는다.
[features]
full-tests = []

[[test]]
name = "lan_broadcast"
path = "tests/lan_broadcast.rs"
required-features = ["full-tests"]

[[test]]
name = "follow_lol"
path = "tests/follow_lol.rs"
required-features = ["full-tests"]
