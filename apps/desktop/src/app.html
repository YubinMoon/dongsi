<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>dongsi</title>
    <!--
      시작 화면(#boot): 앱 JS가 뜨기 전에 먼저 그려진다. 색은 app.css 토큰과 같은 값이다
      (--bg #0d0e11, --text #f3f4f6, --text-2 #a9abb3, --fill. 로고 색만 icon.svg 값). 창·WebView 배경색(tauri.conf.json의
      backgroundColor, live.rs의 시청 창)도 --bg라서 WebView2가 준비되는 동안 흰 화면이 나오지 않는다.
      +layout.svelte가 첫 화면이 준비되면 걷는다(src/lib/boot.ts). 사라지는 시간은 BOOT_FADE_MS와 맞춘다.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0d0e11;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding-bottom: 4vh;
        background: #0d0e11;
        color: #f3f4f6;
        font-family: "Pretendard Variable", "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", system-ui,
          sans-serif;
        transition: opacity 160ms ease-out;
        cursor: progress;
        user-select: none;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 21px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      #boot .boot-bar {
        width: 112px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }
      #boot .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #a9abb3;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-bar::after {
          width: 100%;
          opacity: 0.4;
          animation: none;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot" role="status" aria-label="dongsi 불러오는 중">
      <div class="boot-brand">
        <!-- icon.svg에서 옮김(src-tauri/icons/icon.svg '화면 눈'), viewBox만 그림 범위로 잘랐다. -->
        <svg width="38" height="29.55" viewBox="40 116 944 734" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="boot-pu" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#8E5CFF" /><stop offset="1" stop-color="#6A2EE0" />
            </linearGradient>
          </defs>
          <path d="M296 325 L249 212 M512 276 L512 152 M728 325 L775 212" stroke="#8357FC" stroke-width="72" stroke-linecap="round" fill="none" />
          <path d="M60 560 C 230 160, 794 160, 964 560 C 794 920, 230 920, 60 560 Z" fill="url(#boot-pu)" stroke="url(#boot-pu)" stroke-width="40" stroke-linejoin="round" />
          <rect x="262" y="380" width="500" height="340" rx="92" fill="#B8F23A" />
          <circle cx="512" cy="550" r="106" fill="#3F1590" />
          <circle cx="468" cy="504" r="36" fill="#FFFFFF" />
        </svg>
        dongsi
      </div>
      <div class="boot-bar" aria-hidden="true"></div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
