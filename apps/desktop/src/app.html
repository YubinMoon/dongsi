<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>dongsi</title>
    <!--
      시작 화면(#boot): 앱 JS가 뜨기 전에 먼저 그려진다. 색은 app.css 토큰과 같은 값이다
      (--bg #0d0e11, --text #f3f4f6, --text-2 #a9abb3, --fill). 창·WebView 배경색(tauri.conf.json의
      backgroundColor, live.rs의 시청 창)도 --bg라서 WebView2가 준비되는 동안 흰 화면이 나오지 않는다.
      +layout.svelte가 첫 화면이 준비되면 걷는다(src/lib/boot.ts). 사라지는 시간은 BOOT_FADE_MS와 맞춘다.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0d0e11;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding-bottom: 4vh;
        background: #0d0e11;
        color: #f3f4f6;
        font-family: "Pretendard Variable", "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", system-ui,
          sans-serif;
        transition: opacity 160ms ease-out;
        cursor: progress;
        user-select: none;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font-size: 21px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      #boot .boot-logo {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #f3f4f6;
        color: #0d0e11;
        display: grid;
        place-items: center;
      }
      #boot .boot-bar {
        width: 112px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }
      #boot .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #a9abb3;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-bar::after {
          width: 100%;
          opacity: 0.4;
          animation: none;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot" role="status" aria-label="dongsi 불러오는 중">
      <div class="boot-brand">
        <span class="boot-logo"
          ><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M7 4.5v15l12.5-7.5z" /></svg
        ></span>
        dongsi
      </div>
      <div class="boot-bar" aria-hidden="true"></div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
